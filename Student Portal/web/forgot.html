<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f4f8;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .forgot-container {
      background-color: #fff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
      text-align: center;
    }

    .forgot-container h2 {
      margin-bottom: 10px;
      color: #333;
    }

    .forgot-container p {
      font-size: 14px;
      color: #777;
      margin-bottom: 25px;
    }

    .input-field {
      width: 90%;
      padding: 12px 14px;
      margin: 12px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.3s ease;
    }

    .input-field:focus {
      border-color: #4caf50;
      outline: none;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background-color: #4caf50;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .submit-btn:hover {
      background-color: #45a049;
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #888;
    }

    .icon-circle {
      background-color: #e0f7e9;
      color: #4caf50;
      width: 50px;
      height: 50px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      font-size: 22px;
      margin-bottom: 10px;
    }

    @media (max-width: 480px) {
      .forgot-container {
        padding: 30px 20px;
      }
    }
  </style>
</head>

<body>
  <div class="forgot-container">
    <div class="icon-circle">
      <i class="fas fa-unlock-alt"></i>
    </div>
    <h2>Forgot Password</h2>
    <p>Enter your registered details to reset your password</p>
    <form action="forgotpassword" method="POST">
      <input type="text" name="name" class="input-field" placeholder="Full Name" required />
      <input type="email" name="email" class="input-field" placeholder="Email Address" required />
      <input type="text" name="phone" class="input-field" placeholder="Phone Number" required />
      <button type="submit" class="submit-btn">Reset Password</button>
    </form>
    <div class="footer">
      <p>&copy; 2025 Student Portal</p>
    </div>
  </div>
</body>

</html>
